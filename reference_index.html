<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Tracker</title>
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Workers">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; }
  .app { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  
  /* ─── FULL SCREEN AUTH GATE ─── */
  .auth-gate { position: fixed; inset: 0; background: #f5f5f5; z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 16px; transition: opacity 0.3s ease; }
  .auth-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 420px; box-shadow: 0 12px 40px rgba(0,0,0,0.06); text-align: center; }
  .auth-logo { width: 56px; height: 56px; background: #111; color: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 16px; }
  .auth-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #111; }
  .auth-subtitle { font-size: 13px; color: #666; margin-bottom: 24px; line-height: 1.4; }
  .auth-input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; margin-bottom: 12px; outline: none; transition: border-color 0.2s; background: #fafafa; }
  .auth-input:focus { border-color: #111; background: #fff; }
  .auth-btn-primary { width: 100%; padding: 12px; background: #111; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
  .auth-btn-primary:hover { background: #333; }
  .auth-btn-primary:disabled { background: #666; cursor: not-allowed; }
  .auth-divider { display: flex; align-items: center; margin: 20px 0; color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  .auth-divider::before, .auth-divider::after { content: ""; flex: 1; border-bottom: 1px solid #eee; }
  .auth-divider:not(:empty)::before { margin-right: .75em; }
  .auth-divider:not(:empty)::after { margin-left: .75em; }
  .auth-toggle-text { font-size: 13px; color: #666; margin-top: 20px; }
  .auth-toggle-link { color: #111; font-weight: 600; cursor: pointer; text-decoration: underline; }
  .auth-offline-btn { background: none; border: none; color: #888; font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 16px; padding: 8px; display: inline-block; }
  .auth-offline-btn:hover { color: #111; }
  .auth-forgot-link { display: block; text-align: right; font-size: 12px; color: #666; margin-top: -8px; margin-bottom: 14px; cursor: pointer; text-decoration: underline; }

  /* ─── APP UI STYLES ─── */
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 8px; }
  .top-bar h2 { font-size: 20px; font-weight: 600; color: #111; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .date-nav { display: flex; align-items: center; gap: 6px; flex-wrap:wrap; }
  .dnbtn { background: none; border: 1px solid #ccc; border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 15px; color: #111; display: flex; align-items: center; justify-content: center; }
  .dnbtn:hover { background: #eee; }
  .date-label { font-size: 14px; font-weight: 600; min-width: 115px; text-align: center; color: #111; }
  .pdf-btn { display: flex; align-items: center; gap: 6px; padding: 7px 13px; font-size: 13px; font-weight: 500; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; background: #fff; color: #111; }
  .pdf-btn:hover { background: #f0f0f0; }
  .tabs { display: flex; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-bottom: 1.25rem; background: #fff; }
  .tab { flex: 1; padding: 9px 0; font-size: 13px; font-weight: 500; background: none; border: none; cursor: pointer; color: #666; border-right: 1px solid #ddd; }
  .tab:last-child { border-right: none; }
  .tab.active { background: #f0f0f0; color: #111; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
  .metric { background: #fff; border-radius: 8px; padding: 12px 14px; border: 1px solid #e8e8e8; }
  .mlabel { font-size: 12px; color: #666; margin-bottom: 4px; }
  .mval { font-size: 21px; font-weight: 600; color: #111; }
  .mval.amber { color: #854F0B; }
  .mval.warn { color: #c0392b; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .wname { font-size: 15px; font-weight: 600; color: #111; }
  .wsub { font-size: 12px; color: #888; margin-top: 1px; }
  .balance-pill { margin-left: auto; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill-owe { background: #EAF3DE; color: #27500A; }
  .pill-adv { background: #FCEBEB; color: #791F1F; }
  .pill-zero { background: #f0f0f0; color: #888; }
  .status-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .sbtn { padding: 6px 12px; font-size: 12px; font-weight: 500; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; background: none; color: #666; }
  .sbtn:hover { background: #f5f5f5; }
  .sbtn.sp { background: #EAF3DE; border-color: #3B6D11; color: #3B6D11; }
  .sbtn.sa { background: #FCEBEB; border-color: #A32D2D; color: #A32D2D; }
  .sbtn.sh { background: #FAEEDA; border-color: #854F0B; color: #854F0B; }
  .pay-section { border-top: 1px solid #eee; padding-top: 10px; }
  .pay-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .pay-row label { font-size: 12px; color: #666; min-width: 90px; }
  .pay-row input { padding: 6px 10px; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #111; max-width: 160px; outline: none; }
  .pay-row input:focus { border-color: #888; }
  .pay-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
  .ltable { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  .ltable th { text-align: left; font-size: 12px; font-weight: 600; color: #666; padding: 8px 10px; border-bottom: 1px solid #eee; background: #fafafa; }
  .ltable td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; color: #111; vertical-align: middle; }
  .ltable tr:last-child td { border-bottom: none; }
  .ltable tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .bp { background: #EAF3DE; color: #27500A; }
  .ba { background: #FCEBEB; color: #791F1F; }
  .bh { background: #FAEEDA; color: #633806; }
  .empty { text-align: center; padding: 2.5rem 1rem; color: #aaa; font-size: 14px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .field-row input { padding: 8px 10px; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #111; outline: none; width: 100%; }
  .field-row input:focus { border-color: #888; }
  .add-btn { padding: 8px 14px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; background: #fff; color: #111; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .add-btn:hover { background: #f0f0f0; }
  .wlist-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f0f0f0; }
  .wlist-item:last-child { border-bottom: none; }
  .rm-btn { background: none; border: none; cursor: pointer; color: #ccc; display: flex; align-items: center; padding: 4px; font-size: 16px; }
  .rm-btn:hover { color: #c0392b; }
  .sec-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #111; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #111; color: #fff; border-radius: 8px; padding: 10px 18px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 9999; }
  .toast.show { opacity: 1; }

  /* Sync button */
  .sync-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; font-weight: 500; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; color: #555; white-space: nowrap; }
  .sync-btn:hover { background: #f5f5f5; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
  .sync-dot.ok { background: #3B6D11; }
  .sync-dot.syncing { background: #854F0B; animation: pulse 1s infinite; }
  .sync-dot.err { background: #c0392b; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 6000; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-box { background: #fff; border-radius: 16px; padding: 24px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: #111; }
  .modal-sub { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
  .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 11px; background: #fff; color: #333; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .google-btn:hover { background: #f8f8f8; }
  .info-box { background: #EAF3DE; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: #3B6D11; line-height: 1.5; }
  .divider { border: none; border-top: 1px solid #eee; margin: 16px 0; }

  @media (max-width: 500px) {
    .top-bar { flex-direction: column; align-items: flex-start; }
    .field-row { grid-template-columns: 1fr 1fr; }
    .field-row .add-btn { grid-column: 1 / -1; justify-content: center; }
  }

  /* ─── V2 additions ─── */
  .amber { color: #854F0B; }
  .neg { color: #c0392b; }
  .muted { color: #888; }
  .mval.neg { color: #c0392b; }
  .text-btn { background: none; border: none; color: #666; font-size: 13px; cursor: pointer; width: 100%; padding: 8px; margin-top: 4px; }
  .search-input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; margin-bottom: 8px; background: #fff; color: #111; outline: none; }
  .search-input:focus { border-color: #888; }
  .pay-list-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 5px 0; border-bottom: 1px dashed #eee; gap: 8px; }
  .pay-list-item:last-child { border-bottom: none; }
  .pay-del-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; padding: 2px 4px; }
  .pay-del-btn:hover { color: #c0392b; }
  .pay-mini-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .pay-mini-row input { flex: 1; min-width: 90px; padding: 7px 10px; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #111; outline: none; }
  .pay-mini-row input:focus { border-color: #888; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
  .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .auto-tag { color: #aaa; font-weight: 500; }
  .undo-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; font-weight: 500; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; color: #555; white-space: nowrap; }
  .undo-btn:hover { background: #f5f5f5; }
  .worker-pill { padding: 6px 14px; border-radius: 20px; margin: 2px 4px 2px 0; cursor: pointer; border: 1px solid #ddd; font-size: 12px; display: inline-block; }
</style>
</head>
<body>

<!-- ─── FULL-SCREEN LOGIN GATE ─── -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-logo"><i class="ti ti-users"></i></div>
    <div class="auth-title" id="authGateTitle">Welcome Back</div>
    <div class="auth-subtitle" id="authGateSubtitle">Sign in to sync your worker records across all your devices.</div>

    <form id="authForm" onsubmit="handleEmailAuth(event)">
      <input type="email" id="authEmail" class="auth-input" placeholder="Email address" required>
      <input type="password" id="authPassword" class="auth-input" placeholder="Password (min. 6 characters)" minlength="6" required>
      <a class="auth-forgot-link" onclick="forgotPassword()" id="authForgotBtn">Forgot Password?</a>
      <button type="submit" class="auth-btn-primary" id="authSubmitBtn">Sign In with Email</button>
    </form>

    <div class="auth-divider">or</div>

    <button class="google-btn" onclick="signInWithGoogle()" id="authGoogleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.1l6.7-6.7C35.7 2.5 30.2 0 24 0 14.7 0 6.7 5.6 2.8 13.7l7.8 6.1C12.5 13.5 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.4c-.5 2.8-2.1 5.1-4.5 6.7l7 5.4c4.1-3.8 6.6-9.4 6.6-16.1z"/><path fill="#FBBC05" d="M10.6 28.2C10.2 27 10 25.5 10 24s.2-3 .6-4.2l-7.8-6.1C1 16.5 0 20.1 0 24s1 7.5 2.8 10.3l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7-5.4c-2 1.3-4.6 2.1-8.2 2.1-6.2 0-11.5-4-13.4-9.8l-7.8 6.1C6.7 42.4 14.7 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="auth-toggle-text">
      <span id="authTogglePrompt">Don't have an account?</span> 
      <a class="auth-toggle-link" onclick="toggleAuthMode()" id="authToggleAction">Create Account</a>
    </div>

    <button class="auth-offline-btn" onclick="continueOffline()">Continue Offline (No Sync) →</button>
  </div>
</div>

<!-- ─── MAIN APP CONTENT ─── -->
<div class="app">
  <div class="toast" id="toast"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="authModal" style="display:none" onclick="handleModalBgClick(event)">
    <div class="modal-box" id="authModalBox"></div>
  </div>

  <div class="top-bar">
    <h2><i class="ti ti-users" style="font-size:20px;margin-right:6px;vertical-align:-3px"></i>Worker tracker</h2>
    <div class="top-actions">
      <div class="date-nav">
        <input type="text" id="datePicker" placeholder="DD/MM/YYYY" maxlength="10" inputmode="numeric" oninput="maskDateInput(this)" onchange="jumpToDateDMY(this.value)" style="padding:7px;border:1px solid #ccc;border-radius:8px;font-size:13px;background:#fff;width:100px">
        <button class="dnbtn" onclick="changeDay(-1)" aria-label="Previous day"><i class="ti ti-chevron-left"></i></button>
        <span class="date-label" id="dateLabel"></span>
        <button class="dnbtn" onclick="changeDay(1)" aria-label="Next day"><i class="ti ti-chevron-right"></i></button>
      </div>
      <button class="sync-btn" id="syncBtn" onclick="showAuthModal()">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">Account</span>
      </button>
      <button class="undo-btn" onclick="performUndo()" title="Undo last action"><i class="ti ti-arrow-back-up" style="font-size:15px"></i> Undo</button>
      <button class="pdf-btn" onclick="exportPDF()"><i class="ti ti-file-type-pdf" style="font-size:16px"></i> Export PDF</button>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="mlabel">Total owed to workers</div><div class="mval" id="mOwed">₹0</div></div>
    <div class="metric"><div class="mlabel">Total advance given</div><div class="mval" id="mAdv">₹0</div></div>
    <div class="metric"><div class="mlabel">Present today</div><div class="mval" id="mPres">0</div></div>
    <div class="metric"><div class="mlabel">Paid today</div><div class="mval" id="mPaidToday">₹0</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('today')">Today</button>
    <button class="tab" onclick="switchTab('ledger')">Ledger</button>
    <button class="tab" onclick="switchTab('history')">History</button>
    <button class="tab" onclick="switchTab('manage')">Workers</button>
  </div>

  <div id="tab-today"></div>
  <div id="tab-ledger" style="display:none"></div>
  <div id="tab-history" style="display:none"></div>
  <div id="tab-manage" style="display:none"></div>
</div>

<script>
/* ==========================================================================
   🔥 FIREBASE CONFIGURATION 🔥
   ========================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAj9pmlvsMX5awuFNdpIFSPK2yeg-1YqKs",
  authDomain: "worker-tracker-277d3.firebaseapp.com",
  projectId: "worker-tracker-277d3",
  storageBucket: "worker-tracker-277d3.firebasestorage.app",
  messagingSenderId: "731667317603",
  appId: "1:731667317603:web:f4697de5b2428e977b0956"
};
/* ========================================================================== */

/* ─── Storage Helpers ─── */
function safeStorageGet(key, fallback = null) {
  try {
    const item = localStorage.getItem(key);
    return item ? JSON.parse(item) : fallback;
  } catch (e) { return fallback; }
}

function safeStorageSet(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
    return true;
  } catch (e) {
    showToast('Storage full! Could not save data locally.');
    return false;
  }
}

const esc = str => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
const roundVal = num => Math.round((Number(num) || 0) * 100) / 100;

/* ─── App state ─── */
const COLORS=[['#E6F1FB','#185FA5'],['#EAF3DE','#3B6D11'],['#FAEEDA','#854F0B'],['#FBEAF0','#993556'],['#EEEDFE','#534AB7'],['#E1F5EE','#0F6E56']];
let workers = safeStorageGet('wt_workers', []);
if (!Array.isArray(workers)) workers = [];
workers = workers.map(w => ({
  id: w.id || Date.now() + Math.random(),
  name: String(w.name || 'Unnamed').trim(),
  wage: roundVal(w.wage),
  otWage: roundVal(w.otWage),
  mobile: String(w.mobile || ''),
  photo: String(w.photo || ''),
  active: w.active === undefined ? true : !!w.active
}));
workers.sort((a,b) => a.name.localeCompare(b.name));

let records = safeStorageGet('wt_records', {});
if (!records || typeof records !== 'object' || Array.isArray(records)) records = {};

/* payments[workerId] = [{id, amount, reason, date, time, createdBy, ts}] */
let payments = safeStorageGet('wt_payments', {});
if (!payments || typeof payments !== 'object' || Array.isArray(payments)) payments = {};

let currentDate = new Date();
let activeTab = 'today';
let newName = '', newWage = '', newOtWage = '', newMobile = '';
let editingWorkerId = null;
let historyWorkerId = null;
let historyMonth = null; // 'YYYY-MM'
let workerSearchQuery = '';
let ledgerSearchQuery = '';
let ledgerExpandedId = null;

/* ─── Undo stack (in-memory, last 15 actions) ─── */
let undoStack = [];
function pushUndo(label) {
  try {
    undoStack.push({ label, snapshot: JSON.stringify({ workers, records, payments }) });
    if (undoStack.length > 15) undoStack.shift();
  } catch (e) { /* storage full or serialization issue - skip silently */ }
}
function performUndo() {
  const last = undoStack.pop();
  if (!last) { showToast('Nothing to undo.'); return; }
  try {
    const data = JSON.parse(last.snapshot);
    workers = data.workers; records = data.records; payments = data.payments;
    saveLocal();
    if (currentUser && db) syncToCloud();
    render();
    showToast('Undone: ' + last.label);
  } catch (e) { showToast('Undo failed.'); }
}

/* ─── Firebase / sync state ─── */
let fbApp = null, db = null, fbAuth = null, currentUser = null;
let syncState = 'disconnected';
let syncTimeout = null;
// Used only where input fires rapidly (e.g. typing OT hours) so we don't
// send a cloud write on every keystroke. Everything else syncs instantly via save().
function scheduleSyncToCloud() {
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(syncToCloud, 600);
}
let isLoginMode = true;
let isOfflineMode = safeStorageGet('wt_offline_mode', false);

const dk = d => d.toISOString().slice(0,10);
const pad2 = n => String(n).padStart(2, '0');
// DD/MM/YYYY is the default date representation used throughout the app.
const fmtDMY = d => {
  const dt = (d instanceof Date) ? d : new Date(String(d) + 'T00:00:00');
  return pad2(dt.getDate()) + '/' + pad2(dt.getMonth() + 1) + '/' + dt.getFullYear();
};
const fmtD = d => { const wd = d.toLocaleDateString('en-IN', { weekday: 'short' }); return wd + ', ' + fmtDMY(d); };
const fmtFull = d => fmtDMY(d);
const inits = n => n.trim().split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() || 'W';
const inr = v => { const n = roundVal(v); return (n < 0 ? '-' : '') + 'Rs.' + Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 2}); };
const inrS = v => { const n = roundVal(v); return (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 2}); };

function showToast(msg) {

function compressImage(file, maxWidth = 350, maxHeight = 350, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = event => {
      const img = new Image();
      img.onload = () => {
        let width = img.width; let height = img.height;
        if (width > height) { if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; } } 
        else { if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; } }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });
}

}

async function initFirebase() {
  try {
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    if (!window.firebase) throw new Error('Firebase script error');
    if (!firebase.apps.length) fbApp = firebase.initializeApp(FIREBASE_CONFIG);
    else fbApp = firebase.apps[0];
    
    fbAuth = firebase.auth();
    db = firebase.firestore();
    
    // 🔥 ENABLE OFFLINE PERSISTENCE (PWA Upgrade)
    db.enablePersistence().catch(err => {
      console.warn("Offline persistence issue:", err.message);
    });
    
    fbAuth.getRedirectResult().catch(err => {
      if (err.code !== 'auth/null-user') alert("Google Auth Error: " + err.message);
    });

    fbAuth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        isOfflineMode = false;
        safeStorageSet('wt_offline_mode', false);
        syncState = 'syncing'; updateSyncUI();
        loadFromCloud();
      } else { syncState = 'disconnected'; updateSyncUI(); }
      
      // Reset button states
      const btn = document.getElementById('authSubmitBtn');
      if(btn) {
        btn.disabled = false;
        btn.textContent = isLoginMode ? 'Sign In with Email' : 'Create Account';
      }
      
      updateAuthGateVisibility();
    });
  } catch (e) {
    syncState = 'error'; updateSyncUI();
    showToast('Network error connecting to cloud.');
  }
}

async function loadFromCloud() {
  if (!db || !currentUser) return;
  syncState = 'syncing'; updateSyncUI();
  try {
    const snap = await db.collection('workers_app').doc(currentUser.uid).get();
    if (snap.exists) {
      const data = snap.data();
      const cloudTs = data.updatedAt ? new Date(data.updatedAt).getTime() : 0;
      const localTs = localUpdatedAt();
      // Conflict resolution: only overwrite local data if cloud copy is newer.
      // If local is newer (offline edits), push local up instead of losing them.
      if (cloudTs > localTs) {
        if (data.workers && Array.isArray(data.workers)) workers = data.workers;
        if (data.records && typeof data.records === 'object') records = data.records;
        if (data.payments && typeof data.payments === 'object') payments = data.payments;
        workers = workers.map(w => ({ ...w, active: w.active === undefined ? true : !!w.active }));
        migrateData();
        autoFillMissingDates();
        saveLocal();
        setLocalUpdatedAt(cloudTs);
        showToast('Data loaded from cloud ✓');
      } else if (localTs > cloudTs) {
        syncToCloud();
      }
    } else {
      syncToCloud();
    }
    syncState = 'ok'; updateSyncUI(); render();
  } catch (e) { syncState = 'error'; updateSyncUI(); }
}

async function syncToCloud() {
  if (!db || !currentUser) return;
  if (!navigator.onLine) { syncState = 'error'; updateSyncUI(); return; }
  syncState = 'syncing'; updateSyncUI();
  try {
    const now = new Date().toISOString();
    await db.collection('workers_app').doc(currentUser.uid).set({
      workers, records, payments, updatedAt: now
    });
    setLocalUpdatedAt(new Date(now).getTime());
    syncState = 'ok';
  } catch (e) { syncState = 'error'; }
  updateSyncUI();
}

window.addEventListener('online', () => { if (currentUser && db) syncToCloud(); });
window.addEventListener('offline', () => { if (currentUser) { syncState = 'error'; updateSyncUI(); } });

/* ==========================================================================
   ATTENDANCE ENGINE
   Rules: last recorded status continues automatically until manually
   changed. Missing days are auto-generated. Manually-edited days are never
   overwritten by auto-fill. Editing a past day propagates its new status
   forward through auto-generated (non-manual) days until the next manual
   entry or today, whichever comes first.
   ========================================================================== */

function lastKnownStatusBefore(wid, dateKey) {
  const dates = Object.keys(records).filter(d => d < dateKey && records[d][wid] && records[d][wid].status).sort();
  if (!dates.length) return '';
  return records[dates[dates.length - 1]][wid].status;
}

function fillDay(wid, dateKey, status) {
  if (!records[dateKey]) records[dateKey] = {};
  if (records[dateKey][wid]) return; // never overwrite an existing (manual or generated) record
  records[dateKey][wid] = { status, otHours: 0, earned: 0, paid: 0, generated: true, manual: false };
  recalcEarned(wid, dateKey);
}

// Fills internal gaps between recorded days, and forward-fills from the
// last recorded day up to today, using the last known status each time.
function autoFillMissingDates() {
  const todayKey = dk(new Date());
  workers.forEach(w => {
    const wid = w.id;
    const dates = Object.keys(records).filter(d => records[d][wid] && records[d][wid].status).sort();
    if (!dates.length) return;

    // 1) Fill gaps between existing recorded days
    for (let i = 0; i < dates.length - 1; i++) {
      const status = records[dates[i]][wid].status;
      let cursor = new Date(dates[i] + 'T00:00:00');
      cursor.setDate(cursor.getDate() + 1);
      const nextKey = dates[i + 1];
      while (dk(cursor) < nextKey) {
        fillDay(wid, dk(cursor), status);
        cursor.setDate(cursor.getDate() + 1);
      }
    }

    // 2) Fill forward from the latest recorded day up to today
    const last = dates[dates.length - 1];
    if (last < todayKey) {
      const status = records[last][wid].status;
      let cursor = new Date(last + 'T00:00:00');
      cursor.setDate(cursor.getDate() + 1);
      while (dk(cursor) <= todayKey) {
        fillDay(wid, dk(cursor), status);
        cursor.setDate(cursor.getDate() + 1);
      }
    }
  });
}

// After a manual status change on `fromDateKey`, push the new status
// forward through any auto-generated (non-manual) future days, stopping at
// the next manually-set day.
function propagateForward(wid, fromDateKey, status) {
  const dates = Object.keys(records).filter(d => d > fromDateKey && records[d][wid]).sort();
  for (const d of dates) {
    const rec = records[d][wid];
    if (rec.manual) break;
    rec.status = status;
    recalcEarned(wid, d);
  }
}

function getRec(wid, dateKey) {
  if (!records[dateKey]) records[dateKey] = {};
  if (!records[dateKey][wid]) {
    const lastStatus = lastKnownStatusBefore(wid, dateKey) || '';
    records[dateKey][wid] = { status: lastStatus, otHours: 0, earned: 0, paid: 0, generated: !!lastStatus, manual: false };
    if (lastStatus) recalcEarned(wid, dateKey);
  }
  const r = records[dateKey][wid];
  if (r.otHours === undefined) r.otHours = 0;
  if (r.earned === undefined) r.earned = 0;
  if (r.paid === undefined) r.paid = 0;
  if (r.generated === undefined) r.generated = false;
  if (r.manual === undefined) r.manual = false;
  return r;
}

function recalcEarned(wid, dateKey) {
  const r = records[dateKey]?.[wid];
  const w = workers.find(x => x.id === wid);
  if (!r || !w) return;
  let base = 0;
  if (r.status === 'present') base = roundVal(w.wage);
  else if (r.status === 'half') base = roundVal(w.wage / 2);
  const otAmt = roundVal(roundVal(r.otHours) * roundVal(w.otWage));
  r.earned = roundVal(base + otAmt);
}

/* ==========================================================================
   PAYMENT ENGINE — multiple free-text-reason payments per worker per day
   ========================================================================== */

function getWorkerPaymentsTotal(wid) {
  return roundVal((payments[wid] || []).reduce((s, p) => s + roundVal(p.amount), 0));
}

function addPaymentEntry(wid, amount, reason, dateKey, timeStr) {
  const amt = parseFloat(amount);
  if (isNaN(amt) || amt <= 0) { showToast('Enter a valid payment amount.'); return false; }
  const cleanReason = String(reason || '').trim() || 'Payment';
  if (!payments[wid]) payments[wid] = [];

  // Duplicate-payment guard: same amount + reason + date within the last 15s
  const dup = payments[wid].some(p => p.date === dateKey && p.reason === cleanReason && Math.abs(p.amount - amt) < 0.01 && (Date.now() - p.ts) < 15000);
  if (dup && !confirm('A very similar payment was just added. Add it again?')) return false;

  pushUndo('Add payment');
  payments[wid].push({
    id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7),
    amount: roundVal(amt),
    reason: cleanReason,
    date: dateKey,
    time: timeStr || new Date().toTimeString().slice(0, 5),
    createdBy: '',
    ts: Date.now()
  });
  save();
  return true;
}

function deletePaymentEntry(wid, pid) {
  if (!payments[wid]) return;
  pushUndo('Delete payment');
  payments[wid] = payments[wid].filter(p => p.id !== pid);
  save(); render();
  showToast('Payment removed.');
}

function editPaymentEntry(wid, pid, amount, reason) {
  const p = (payments[wid] || []).find(x => x.id === pid);
  if (!p) return;
  const amt = parseFloat(amount);
  if (isNaN(amt) || amt <= 0) { showToast('Enter a valid amount.'); return; }
  pushUndo('Edit payment');
  p.amount = roundVal(amt);
  p.reason = String(reason || '').trim() || 'Payment';
  save(); render();
}

function getWorkerTotals(wid) {
  let earned = 0, present = 0, half = 0, absent = 0;
  Object.keys(records).forEach(d => {
    const r = records[d]?.[wid];
    if (r && r.status) {
      earned = roundVal(earned + roundVal(r.earned));
      if (r.status === 'present') present++;
      else if (r.status === 'half') half++;
      else if (r.status === 'absent') absent++;
    }
  });
  const paid = getWorkerPaymentsTotal(wid);
  return { earned, paid, balance: roundVal(earned - paid), present, half, absent };
}

function getBalance(wid) { return getWorkerTotals(wid).balance; }

function setStatus(wid, status) {
  const d = dk(currentDate);
  pushUndo('Change status');
  const r = getRec(wid, d);
  r.status = status;
  r.manual = true;
  r.generated = false;
  recalcEarned(wid, d);
  propagateForward(wid, d, status);
  autoFillMissingDates();
  save(); render();
}

function setOtHours(wid, val) {
  const d = dk(currentDate);
  const r = getRec(wid, d);
  const parsed = parseFloat(val);
  if (val !== '' && (isNaN(parsed) || parsed < 0)) { showToast('OT hours cannot be negative.'); return; }
  r.otHours = val === '' ? 0 : roundVal(parsed);
  r.manual = true;
  r.generated = false;
  recalcEarned(wid, d);
  // Local save happens instantly; cloud sync is briefly debounced since this
  // fires on every keystroke while typing OT hours.
  saveLocal();
  if (currentUser && db) scheduleSyncToCloud();
  const txtNode = document.getElementById(`earned-${wid}`);
  if (txtNode) txtNode.textContent = inrS(r.earned || 0);
  updateMetrics();
}

function submitPayment(wid) {
  const amtEl = document.getElementById('pamt-' + wid);
  const reasonEl = document.getElementById('preason-' + wid);
  if (!amtEl || !reasonEl) return;
  const d = dk(currentDate);
  const timeStr = new Date().toTimeString().slice(0, 5);
  const ok = addPaymentEntry(wid, amtEl.value, reasonEl.value, d, timeStr);
  if (ok) { amtEl.value = ''; reasonEl.value = ''; render(); showToast('Payment added.'); }
}

function removePayment(wid, pid) { deletePaymentEntry(wid, pid); }

function renderPayListForDay(wid, d) {
  const list = (payments[wid] || []).filter(p => p.date === d).sort((a, b) => a.ts - b.ts);
  if (!list.length) return '<div class="pay-hint">No payments today.</div>';

    <button class="pay-del-btn" onclick="removePayment(${wid},'${p.id}')" title="Delete payment"><i class="ti ti-x"></i></button></span>
  </div>`).join('');
}

/* ==========================================================================
   DATA MIGRATION — legacy single "paid" field per day → payments array.
   Idempotent: safe to call every startup (already-migrated records have
   paid = 0, so nothing further happens on repeat calls).
   ========================================================================== */
function migrateData() {
  Object.keys(records).forEach(d => {
    Object.keys(records[d]).forEach(wid => {
      const r = records[d][wid];
      if (!r) return;
      if (r.paid && Number(r.paid) > 0) {
        if (!payments[wid]) payments[wid] = [];
        payments[wid].push({
          id: 'legacy' + d + '_' + wid,
          amount: roundVal(r.paid),
          reason: 'Legacy Payment',
          date: d,
          time: '00:00',
          createdBy: '',
          ts: new Date(d + 'T00:00:00').getTime()
        });
      }
      r.paid = 0;
      if (r.manual === undefined) r.manual = !!r.status; // treat pre-existing entries as manually set
      if (r.generated === undefined) r.generated = false;
      if (r.otHours === undefined) r.otHours = 0;
      if (r.earned === undefined) r.earned = 0;
    });
  });
}

function changeDay(d) { currentDate = new Date(currentDate); currentDate.setDate(currentDate.getDate()+d); render(); }

// Auto-inserts slashes as the user types digits into the DD/MM/YYYY field.
function maskDateInput(el) {
  const digits = el.value.replace(/\D/g, '').slice(0, 8);
  let out = digits;
  if (digits.length > 4) out = digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4);
  else if (digits.length > 2) out = digits.slice(0, 2) + '/' + digits.slice(2);
  el.value = out;
}

// Parses a DD/MM/YYYY string typed into the date field and jumps to it.
function jumpToDateDMY(val) {
  if (!val) return;
  const m = val.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) { showToast('Enter a date as DD/MM/YYYY.'); return; }
  const [, dd, mm, yyyy] = m;
  const dt = new Date(`${yyyy}-${mm}-${dd}T00:00:00`);
  if (isNaN(dt.getTime()) || dt.getDate() !== Number(dd) || (dt.getMonth() + 1) !== Number(mm)) {
    showToast('That date does not exist.'); return;
  }
  currentDate = dt;
  render();
}
function switchTab(t) { activeTab = t; render(); }

function updateMetrics() {
  const d = dk(currentDate);
  let pres = 0, paidToday = 0, totalOwed = 0, totalAdv = 0;
  workers.forEach(w => {
    if (w.active !== false) {
      const r = records[d] ? records[d][w.id] : null;
      if (r && (r.status === 'present' || r.status === 'half')) pres++;
    }
    (payments[w.id] || []).forEach(p => { if (p.date === d) paidToday = roundVal(paidToday + roundVal(p.amount)); });
    const bal = getBalance(w.id);
    if (bal > 0) totalOwed = roundVal(totalOwed + bal);
    else totalAdv = roundVal(totalAdv + Math.abs(bal));
  });
  const elOwed = document.getElementById('mOwed');
  const elAdv = document.getElementById('mAdv');
  const elPres = document.getElementById('mPres');
  const elPaidToday = document.getElementById('mPaidToday');
  if (elOwed) { elOwed.textContent = inrS(totalOwed); elOwed.className = 'mval ' + (totalOwed > 0 ? 'amber' : ''); }
  if (elAdv) { elAdv.textContent = inrS(totalAdv); elAdv.className = 'mval ' + (totalAdv > 0 ? 'warn' : ''); }
  if (elPres) { elPres.textContent = pres; }
  if (elPaidToday) { elPaidToday.textContent = inrS(paidToday); }
}

function renderToday() {
  const container = document.getElementById('tab-today');
  if (!container) return;
  const d = dk(currentDate);
  const activeWorkers = workers.filter(w => w.active !== false);
  if (!workers.length) {
    container.innerHTML = '<div class="empty">Add workers in the Workers tab first.</div>';
    return;
  }
  if (!activeWorkers.length) {
    container.innerHTML = '<div class="empty">All workers are marked inactive. Reactivate a worker in the Workers tab.</div>';
    return;
  }
  let html = '';
  activeWorkers.forEach((w, i) => {
    const r = getRec(w.id, d);
    const [bg, fg] = COLORS[i % COLORS.length];
    const bal = getBalance(w.id);
    const pillCls = bal > 0 ? 'pill-owe' : bal < 0 ? 'pill-adv' : 'pill-zero';
    const pillTxt = bal > 0 ? 'Owed ' + inrS(bal) : bal < 0 ? 'Advance ' + inrS(Math.abs(bal)) : 'Settled';
    const ps = r.status === 'present' ? 'sp' : '';
    const hs = r.status === 'half' ? 'sh' : '';
    const as = r.status === 'absent' ? 'sa' : '';
    const autoTag = r.generated ? ' <span class="auto-tag">(auto-continued)</span>' : '';
    html += `<div class="card">
      <div class="card-header">
        ${w.photo ? `<img src="${w.photo}" class="avatar" style="object-fit:cover">` : `<div class="avatar" style="background:${bg};color:${fg}">${inits(w.name)}</div>`}
        <div><div class="wname">${esc(w.name)}</div><div class="wsub">₹${roundVal(w.wage)}/day • OT: ₹${roundVal(w.otWage)}/hr</div></div>
        <span class="balance-pill ${pillCls}">${pillTxt}</span>
      </div>
      <div class="status-row">
        <button class="sbtn ${ps}" onclick="setStatus(${w.id},'present')">Present</button>
        <button class="sbtn ${hs}" onclick="setStatus(${w.id},'half')">Half day</button>
        <button class="sbtn ${as}" onclick="setStatus(${w.id},'absent')">Absent</button>
      </div>
      <div class="pay-section">
        <div class="pay-row"><label>OT Hours</label><input type="number" placeholder="0" value="${r.otHours || ''}" oninput="setOtHours(${w.id},this.value)" step="0.5" min="0"></div>
        <div class="pay-row"><label>Earned today</label><span id="earned-${w.id}" style="font-size:13px;font-weight:600">${inrS(r.earned || 0)}</span>${autoTag}</div>
        <div id="paylist-${w.id}">${renderPayListForDay(w.id, d)}</div>
        <div class="pay-mini-row">
          <input type="number" placeholder="Amount ₹" id="pamt-${w.id}" step="1" min="0">
          <input type="text" placeholder="Reason (e.g. Advance, Tea)" id="preason-${w.id}">
          <button class="add-btn" onclick="submitPayment(${w.id})"><i class="ti ti-plus" style="font-size:14px"></i> Add</button>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

function onLedgerSearch(v) { ledgerSearchQuery = v; renderLedger(); }
function toggleLedgerExpand(id) { ledgerExpandedId = (ledgerExpandedId === id) ? null : id; renderLedger(); }

function renderLedger() {
  const container = document.getElementById('tab-ledger');
  if (!container) return;
  if (!workers.length) { container.innerHTML = '<div class="empty">Add workers in the Workers tab first.</div>'; return; }
  const q = (ledgerSearchQuery || '').toLowerCase();
  const filtered = workers.filter(w => !q || w.name.toLowerCase().includes(q) || (w.mobile || '').toLowerCase().includes(q));

  let html = `<div class="card"><input type="text" class="search-input" placeholder="Search by name or mobile" value="${esc(ledgerSearchQuery)}" oninput="onLedgerSearch(this.value)"></div>`;
  html += '<div class="card"><table class="ltable"><thead><tr><th>Worker</th><th>Earned</th><th>Paid</th><th>Balance</th></tr></thead><tbody>';
  filtered.forEach(w => {
    const tot = getWorkerTotals(w.id);
    const balCls = tot.balance > 0 ? 'amber' : tot.balance < 0 ? 'neg' : 'muted';
    const balTxt = tot.balance > 0 ? 'Owed ' + inrS(tot.balance) : tot.balance < 0 ? 'Advance ' + inrS(Math.abs(tot.balance)) : 'Settled';
    const inactiveTag = w.active === false ? ' <small style="color:#aaa">(Inactive)</small>' : '';
    html += `<tr style="cursor:pointer" onclick="toggleLedgerExpand(${w.id})"><td>${esc(w.name)}${inactiveTag}</td><td>${inrS(tot.earned)}</td><td>${inrS(tot.paid)}</td><td class="${balCls}">${balTxt}</td></tr>`;
    if (ledgerExpandedId === w.id) {
      const pays = (payments[w.id] || []).slice().sort((a, b) => b.ts - a.ts).slice(0, 30);
      const rows = pays.length
        ? pays.map(p => `<div class="pay-list-item"><span>${fmtFull(p.date)} ${p.time} • ${esc(p.reason)}</span><b>${inrS(p.amount)}</b></div>`).join('')
        : '<div class="pay-hint">No payments recorded yet.</div>';
      html += `<tr><td colspan="4" style="background:#fafafa">${rows}</td></tr>`;
    }
  });
  html += '</tbody></table></div>';
  container.innerHTML = html;
}

function shiftHistoryMonth(delta) {
  const [y, m] = historyMonth.split('-').map(Number);
  const dd = new Date(y, m - 1 + delta, 1);
  historyMonth = dd.getFullYear() + '-' + String(dd.getMonth() + 1).padStart(2, '0');
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('tab-history');
  if (!container) return;
  if (!workers.length) { container.innerHTML = '<div class="empty">Add workers in the Workers tab first.</div>'; return; }
  if (!historyWorkerId || !workers.find(w => w.id === historyWorkerId)) historyWorkerId = workers[0].id;
  if (!historyMonth) historyMonth = dk(new Date()).slice(0, 7);
  const w = workers.find(x => x.id === historyWorkerId);

  const pills = workers.map(ww => {
    const active = ww.id === historyWorkerId;
    const tag = ww.active === false ? ' (Inactive)' : '';
    return `<span class="worker-pill" onclick="historyWorkerId=${ww.id};renderHistory()" style="background:${active ? '#111' : '#fff'};color:${active ? '#fff' : '#666'}">${esc(ww.name)}${tag}</span>`;
  }).join('');

  const [y, m] = historyMonth.split('-').map(Number);
  const monthDate = new Date(y, m - 1, 1);
  const monthLabel = monthDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDow = monthDate.getDay();

  let calCells = '';
  for (let i = 0; i < firstDow; i++) calCells += '<div></div>';
  let mPresent = 0, mHalf = 0, mAbsent = 0, mEarned = 0, mPaid = 0;
  for (let day = 1; day <= daysInMonth; day++) {
    const dstr = `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    const r = records[dstr]?.[w.id];
    let bg = '#f5f5f5', fg = '#bbb';
    if (r && r.status) {
      if (r.status === 'present') { bg = '#EAF3DE'; fg = '#27500A'; mPresent++; }
      else if (r.status === 'half') { bg = '#FAEEDA'; fg = '#633806'; mHalf++; }
      else if (r.status === 'absent') { bg = '#FCEBEB'; fg = '#791F1F'; mAbsent++; }
      mEarned = roundVal(mEarned + roundVal(r.earned));
    }
    calCells += `<div class="cal-cell" style="background:${bg};color:${fg}" title="${fmtDMY(dstr)}${r && r.status ? ' — ' + r.status : ''}">${day}</div>`;
  }
  (payments[w.id] || []).forEach(p => { if (p.date.startsWith(historyMonth)) mPaid = roundVal(mPaid + roundVal(p.amount)); });

  const tot = getWorkerTotals(w.id);
  const balCls = tot.balance > 0 ? 'amber' : tot.balance < 0 ? 'neg' : 'muted';
  const balTxt = tot.balance > 0 ? 'Owed ' + inrS(tot.balance) : tot.balance < 0 ? 'Advance ' + inrS(Math.abs(tot.balance)) : 'Settled';

  const dates = Object.keys(records).filter(d => records[d][w.id] && records[d][w.id].status).sort().reverse();
  let rows = '';
  dates.forEach(d => {
    const r = records[d][w.id];
    const dayPays = (payments[w.id] || []).filter(p => p.date === d);
    const paidTxt = dayPays.length ? dayPays.map(p => inrS(p.amount) + ' (' + esc(p.reason) + ')').join(', ') : '—';
    const badgeCls = r.status === 'present' ? 'bp' : r.status === 'half' ? 'bh' : 'ba';
    rows += `<tr><td>${fmtFull(d)}</td><td><span class="badge ${badgeCls}">${r.status}</span>${r.generated ? ' <span class="auto-tag">auto</span>' : ''}</td><td>${inrS(r.earned)}</td><td style="font-size:11px">${paidTxt}</td></tr>`;
  });

  container.innerHTML = `
    <div style="margin-bottom:12px">${pills}</div>
    <div class="card">
      <div class="cal-nav">
        <button class="dnbtn" onclick="shiftHistoryMonth(-1)"><i class="ti ti-chevron-left"></i></button>
        <b>${monthLabel}</b>
        <button class="dnbtn" onclick="shiftHistoryMonth(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="cal-grid">${calCells}</div>
      <div class="metrics" style="margin-bottom:0">
        <div class="metric"><div class="mlabel">Present</div><div class="mval">${mPresent}</div></div>
        <div class="metric"><div class="mlabel">Half day</div><div class="mval">${mHalf}</div></div>
        <div class="metric"><div class="mlabel">Absent</div><div class="mval">${mAbsent}</div></div>
        <div class="metric"><div class="mlabel">Earned (month)</div><div class="mval">${inrS(mEarned)}</div></div>
        <div class="metric"><div class="mlabel">Paid (month)</div><div class="mval">${inrS(mPaid)}</div></div>
      </div>
    </div>
    <div class="card">
      <div class="sec-title">Overall — ${esc(w.name)}</div>
      <div class="metrics" style="margin-bottom:0">
        <div class="metric"><div class="mlabel">Total earned</div><div class="mval">${inrS(tot.earned)}</div></div>
        <div class="metric"><div class="mlabel">Total paid</div><div class="mval">${inrS(tot.paid)}</div></div>
        <div class="metric"><div class="mlabel">Balance</div><div class="mval ${balCls}">${balTxt}</div></div>
      </div>
    </div>
    <div class="card"><table class="ltable"><thead><tr><th>Date</th><th>Status</th><th>Earned</th><th>Payments</th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="empty">No records yet.</td></tr>'}</tbody></table></div>`;
}

function onWorkerSearch(v) { workerSearchQuery = v; renderManage(); }

function toggleWorkerActive(id) {
  const w = workers.find(x => x.id === id);
  if (!w) return;
  pushUndo('Toggle worker status');
  w.active = w.active === false ? true : false;
  save(); render();
  showToast(w.active !== false ? 'Worker activated.' : 'Worker marked inactive.');
}

function confirmDeleteWorker(id) {
  const w = workers.find(x => x.id === id);
  if (!w) return;
  if (!confirm(`Permanently delete ${w.name} and all their attendance/payment records? This cannot be undone once you leave this action.`)) return;
  pushUndo('Delete worker: ' + w.name);
  workers = workers.filter(x => x.id !== id);
  save(); render();
  showToast('Worker deleted.');
}

function renderManage() {
  const container = document.getElementById('tab-manage');
  if (!container) return;
  const q = (workerSearchQuery || '').toLowerCase();
  const filtered = workers.filter(w => !q || w.name.toLowerCase().includes(q) || (w.mobile || '').toLowerCase().includes(q));
  const activeList = filtered.filter(w => w.active !== false);
  const inactiveList = filtered.filter(w => w.active === false);

  const rowHtml = w => `<div class="wlist-item">
      <div style="flex:1"><b>${esc(w.name)}</b>${w.active === false ? ' <small style="color:#aaa">(Inactive)</small>' : ''}<br><small>₹${w.wage}/day${w.mobile ? ' • ' + esc(w.mobile) : ''}</small></div>
      <button class="add-btn" onclick="editWorker(${w.id})">Edit</button>
      <button class="add-btn" onclick="toggleWorkerActive(${w.id})">${w.active === false ? 'Activate' : 'Deactivate'}</button>
      <button class="rm-btn" onclick="confirmDeleteWorker(${w.id})" title="Delete permanently"><i class="ti ti-trash"></i></button>
    </div>`;

  container.innerHTML = `
    <div class="card">
      <div class="sec-title">${editingWorkerId ? 'Edit Worker' : 'Add Worker'}</div>
      <div class="field-row"><input type="text" placeholder="Worker Name" id="nn"><input type="number" placeholder="Wage / day" id="nw"></div>
      <div class="field-row"><input type="number" placeholder="OT Wage / hr" id="notw"><input type="text" placeholder="Mobile Number" id="nmobile"></div>
      <button class="add-btn" onclick="addWorker()" style="width:100%;margin-top:8px">${editingWorkerId ? 'Update Worker' : 'Save Worker'}</button>
    </div>
    <div class="card">
      <input type="text" class="search-input" placeholder="Search by name or mobile" value="${esc(workerSearchQuery)}" oninput="onWorkerSearch(this.value)">
      <div class="sec-title" style="font-size:13px;color:#666">Active (${activeList.length})</div>
      ${activeList.map(rowHtml).join('') || '<div class="empty">No active workers.</div>'}
    </div>
    ${inactiveList.length ? `<div class="card"><div class="sec-title" style="font-size:13px;color:#666">Inactive (${inactiveList.length})</div>${inactiveList.map(rowHtml).join('')}</div>` : ''}
  `;
}

function editWorker(id) {
  const w = workers.find(x => x.id === id);
  if (!w) return;
  editingWorkerId = id;
  renderManage();
  document.getElementById('nn').value = w.name;
  document.getElementById('nw').value = w.wage;
  document.getElementById('notw').value = w.otWage;
  document.getElementById('nmobile').value = w.mobile;
}

function addWorker() {
  const nnEl = document.getElementById('nn'), nwEl = document.getElementById('nw'), notwEl = document.getElementById('notw'), nmobEl = document.getElementById('nmobile');
  const n = nnEl.value.trim();
  const wageRaw = nwEl.value, otRaw = notwEl.value;
  const wage = parseFloat(wageRaw), ot = parseFloat(otRaw);
  const mob = nmobEl.value.trim();

  if (!n) { showToast('Please enter a worker name.'); return; }
  if (wageRaw !== '' && (isNaN(wage) || wage < 0)) { showToast('Wage cannot be negative.'); return; }
  if (otRaw !== '' && (isNaN(ot) || ot < 0)) { showToast('OT wage cannot be negative.'); return; }

  // 🔥 DUPLICATE PREVENTION LOGIC
  const isDuplicate = workers.some(w =>
    w.name.toLowerCase() === n.toLowerCase() && w.id !== editingWorkerId
  );
  if (isDuplicate) {
    showToast('A worker with this name already exists!');
    return;
  }

  pushUndo(editingWorkerId ? 'Edit worker' : 'Add worker');
  if (editingWorkerId) {
    const w = workers.find(x => x.id === editingWorkerId);
    w.name = n; w.wage = roundVal(wage || 0); w.otWage = roundVal(ot || 0); w.mobile = mob;
    editingWorkerId = null;
  } else {
    workers.push({ id: Date.now(), name: n, wage: roundVal(wage || 0), otWage: roundVal(ot || 0), mobile: mob, active: true });
  }
  workers.sort((a, b) => a.name.localeCompare(b.name));

  nnEl.value = ''; nwEl.value = ''; notwEl.value = ''; nmobEl.value = '';

  save(); render();
  showToast('Worker saved.');
}

function render() {
  autoFillMissingDates();
  document.getElementById('dateLabel').textContent = fmtD(currentDate);
  const dpEl = document.getElementById('datePicker');
  if (dpEl && document.activeElement !== dpEl) dpEl.value = fmtDMY(currentDate);
  ['today','ledger','history','manage'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === activeTab ? '' : 'none';
  });
  if (activeTab === 'today') renderToday();
  else if (activeTab === 'ledger') renderLedger();
  else if (activeTab === 'history') renderHistory();
  else renderManage();
  updateMetrics();
}

function exportPDF() {
  if (!window.jspdf) { showToast('PDF library not loaded yet — try again in a moment.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(16); doc.text('Worker Tracker — Summary Report', 14, 18);
  doc.setFontSize(9); doc.setTextColor(120);
  const now = new Date();
  const timeStr = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  doc.text('Generated on ' + fmtDMY(now) + ' ' + timeStr, 14, 24);
  doc.setTextColor(0);

  // Attendance + earnings + balance per worker
  const workerRows = workers.map(w => {
    const t = getWorkerTotals(w.id);
    return [
      w.name + (w.active === false ? ' (Inactive)' : ''),
      t.present, t.half, t.absent,
      inr(t.earned), inr(t.paid),
      (t.balance >= 0 ? 'Owed ' : 'Advance ') + inr(Math.abs(t.balance))
    ];
  });
  doc.autoTable({
    startY: 30,
    head: [['Worker', 'Present', 'Half', 'Absent', 'Earned', 'Paid', 'Balance']],
    body: workerRows,
    styles: { fontSize: 8 }
  });

  // Payment summary grouped by free-text reason
  const reasonTotals = {};
  workers.forEach(w => (payments[w.id] || []).forEach(p => {
    const key = p.reason || 'Payment';
    reasonTotals[key] = roundVal((reasonTotals[key] || 0) + roundVal(p.amount));
  }));
  const reasonRows = Object.keys(reasonTotals)
    .sort((a, b) => reasonTotals[b] - reasonTotals[a])
    .map(k => [k, inr(reasonTotals[k])]);

  let y = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(12); doc.text('Payment Summary by Reason', 14, y);
  doc.autoTable({
    startY: y + 4,
    head: [['Reason', 'Total Paid']],
    body: reasonRows.length ? reasonRows : [['No payments recorded', '—']],
    styles: { fontSize: 8 }
  });

  // This month's totals across all workers
  const mk = dk(new Date()).slice(0, 7);
  let mEarnedAll = 0, mPaidAll = 0;
  workers.forEach(w => {
    Object.keys(records).forEach(d => {
      if (d.startsWith(mk)) {
        const r = records[d][w.id];
        if (r && r.status) mEarnedAll = roundVal(mEarnedAll + roundVal(r.earned));
      }
    });
    (payments[w.id] || []).forEach(p => { if (p.date.startsWith(mk)) mPaidAll = roundVal(mPaidAll + roundVal(p.amount)); });
  });

  let y2 = doc.lastAutoTable.finalY + 10;
  if (y2 > 260) { doc.addPage(); y2 = 20; }
  doc.setFontSize(12); doc.text('This Month Totals', 14, y2);
  doc.setFontSize(10);
  doc.text(`Total Earned: ${inr(mEarnedAll)}    Total Paid: ${inr(mPaidAll)}`, 14, y2 + 7);

  doc.save('worker-report-' + fmtDMY(new Date()).replace(/\//g, '-') + '.pdf');
}

migrateData();
autoFillMissingDates();
saveLocal();
updateSyncUI();
initFirebase();
render();
</script>
</body>
</html>
